<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table, tr, td, th {
            border-style: solid;
            border-width: 2px;
            border-collapse: collapse;
            margin: 0px;
            padding: 0px;
        }
        th {
            text-align: left;
        }
        td {
            text-align: center;
        }
        tr:hover{
            background-color: red;
        }
        .ganjil {
            background-color: blue;
        }
        .genap {
            background-color: green;
        }
        table {
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
        </thead>
        <tbody>
            <tr class="ganjil">
                <td>budi</td>
                <td>100</td>
            </tr>
            <tr class="genap">
                <td>eko</td>
                <td>90</td>
            </tr>
            <tr class="ganjil">
                <td>udin</td>
                <td>80</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
