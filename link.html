<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>link</title>
    <style>
        a{
            background-color: white;
            border-style: solid;
            border-radius: 10px;
            padding: 10px;
            text-decoration: none;
            font-family: sans-serif;
            border-color: blue;
            color: blue;
        }
        a:visited{
            color: red;
            border-color: green;
        }
        a:hover{
            color: purple;
            border-color: orange;
            background-color: brown;
        }
        div {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
        <a href="http://google.com">google</a>
        <a href="http://youtube.com">youtube</a>
        <a href="http://facebook.com">facebook</a>
    </div>
</body>
</html>
