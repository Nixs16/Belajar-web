<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cascade</title>

    <link rel="stylesheet" href="hello.css">

    <style>
        /*kalo important di taruh di .css sistem tetap akan mendahulukan
        important yg ada disini*/
        h1 {
            color: black !important;
        }
 
        h1 {
            color: orange;
        }
    </style>
</head>

<body>
    <h1>ini judul</h1>
    <h2>ini sub judul</h2>
</body>
</html>
